# PostgreSQL for the OneSpace API server (the server also runs on an embedded H2 file without it).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: onespace
      POSTGRES_USER: onespace
      POSTGRES_PASSWORD: onespace
    ports:
      - "5432:5432"
    volumes:
      - onespace-db:/var/lib/postgresql/data
volumes:
  onespace-db:
